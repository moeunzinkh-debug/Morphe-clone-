name: Build installable APK

# Produces signed, installable microG-RE APKs and attaches them as downloadable
# artifacts. No repository secrets are needed: the APK is signed with a
# throwaway key generated during the run, so it installs fine on a device but
# cannot upgrade an installation signed with the official release key
# (uninstall the official microG first, or the other way round).
#
# This workflow does not change a single line of the app source.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Which package to build"
        type: choice
        required: false
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
  push:
    branches:
      - main
      - apk-build
      - "arena/**"
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  select:
    name: "Select what to build"
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.pick.outputs.abis }}
    steps:
      - name: "Pick ABIs"
        id: pick
        run: |
          set -euo pipefail
          REQ='${{ github.event.inputs.abi }}'
          [ -z "$REQ" ] && REQ=all
          case "$REQ" in
            all) ABIS='["arm64-v8a","armeabi-v7a","universal"]' ;;
            arm64-v8a|armeabi-v7a|x86_64|x86) ABIS="[\"$REQ\"]" ;;
            *) echo "unsupported abi: $REQ" >&2; exit 1 ;;
          esac
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "building: $ABIS"

  build:
    name: "Build ${{ matrix.abi }}"
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.select.outputs.abis) }}

    steps:
      - name: "Free disk space"
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go || true
          df -h /

      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "Build release APK"
        run: |
          set -euo pipefail
          if [ "${{ matrix.abi }}" = "universal" ]; then
            ARGS=""
          else
            ARGS="-Pabi=${{ matrix.abi }}"
          fi
          echo "gradle args: [$ARGS]"
          ./gradlew --no-daemon :play-services-core:assembleDefaultRelease $ARGS

      - name: "Sign and verify the APK"
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BUILD_TOOLS"

          # Throwaway signing key: the maintainers' release key is not available
          # here, and an unsigned APK cannot be installed at all.
          keytool -genkeypair -v -keystore testkey.jks -alias testkey \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass testpass -keypass testpass \
            -dname "CN=MicroG-RE test build, OU=CI, O=Morphe-clone, C=US"

          UNSIGNED="$(find play-services-core/build/outputs/apk -name '*.apk' | head -n1)"
          echo "built: $UNSIGNED"
          ls -lh "$UNSIGNED"

          mkdir -p dist
          NAME="microg-${{ matrix.abi }}-testsigned"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "dist/$NAME-unaligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks testkey.jks --ks-pass pass:testpass --key-pass pass:testpass --ks-key-alias testkey \
            --out "dist/$NAME.apk" "dist/$NAME-unaligned.apk"
          rm -f "dist/$NAME-unaligned.apk" testkey.jks

          echo "--- archive integrity ---"
          unzip -tqq "dist/$NAME.apk"
          echo "--- signature ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/$NAME.apk"
          echo "--- package info ---"
          "$BUILD_TOOLS/aapt" dump badging "dist/$NAME.apk" | head -3
          echo "--- native libraries ---"
          unzip -l "dist/$NAME.apk" | grep -E ' lib/' | awk '{print $4, $1}' | sort | head -20 || true
          echo "--- size ---"
          ls -lh dist/
          SIZE="$(stat -c '%s' "dist/$NAME.apk")"
          SHA="$(sha256sum "dist/$NAME.apk" | awk '{print $1}')"
          echo "$NAME.apk: $SIZE bytes"
          echo "sha256: $SHA"

          {
            echo "## microg-${{ matrix.abi }}"
            echo
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| file | \`$NAME.apk\` |"
            echo "| size | $SIZE bytes ($(awk -v s="$SIZE" 'BEGIN{printf "%.2f", s/1048576}') MB) |"
            echo "| sha256 | \`$SHA\` |"
            echo "| package | ${{ matrix.abi }} |"
            echo
            echo '```'
            "$BUILD_TOOLS/aapt" dump badging "dist/$NAME.apk" | head -3
            "$BUILD_TOOLS/apksigner" verify --print-certs "dist/$NAME.apk" | head -8
            unzip -l "dist/$NAME.apk" | grep -E ' lib/' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: microg-${{ matrix.abi }}
          if-no-files-found: error
          archive: false
          path: dist/*.apk
